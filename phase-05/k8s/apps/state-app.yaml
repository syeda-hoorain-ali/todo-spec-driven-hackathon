apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-app
  labels:
    app: state-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: state-app
  template:
    metadata:
      labels:
        app: state-app
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "state-app"
        dapr.io/app-port: "8083"
        dapr.io/log-level: "info"
        dapr.io/config: "dapr-config"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
      - name: app
        image: state-app:latest
        imagePullPolicy: Never  # Use local image
        env:
        - name: PORT
          value: "8083"
        ports:
        - containerPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: state-app
spec:
  selector:
    app: state-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8083
  type: ClusterIP
