apiVersion: v1
kind: ConfigMap
metadata:
  name: dapr-prometheus-config
  namespace: dapr-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      # - "first_rules.yml"
      # - "second_rules.yml"

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'dapr-system-services'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - dapr-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

      - job_name: 'dapr-applications'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_enabled]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "3500|50001"  # DAPR HTTP and gRPC ports
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: replace
            target_label: __address__
            regex: (\d+)
            replacement: $$1
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod_name
---
apiVersion: v1
kind: Service
metadata:
  name: dapr-monitoring-service
  namespace: dapr-system
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
  type: ClusterIP
