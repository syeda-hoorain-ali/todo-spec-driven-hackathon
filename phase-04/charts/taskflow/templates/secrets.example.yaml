apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskflow.fullname" . }}-config
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
data:
  # Frontend configuration
  NEXT_PUBLIC_BASE_URL: "http://{{ include "taskflow.fullname" . }}-frontend-service:3000"
  NEXT_PUBLIC_API_BASE_URL: "http://{{ include "taskflow.fullname" . }}-backend-service:8000/api"
  NODE_ENV: "production"

  # Backend configuration
  MCP_SERVER_URL: "http://{{ include "taskflow.fullname" . }}-mcp-server-service:8080"
  ENVIRONMENT: "production"
  JWT_ALGORITHM: "EdDSA"

  # MCP Server configuration
  DEBUG: "False"
  PORT: "8080"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  JWT_ALGORITHM_MCP: "HS256"

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskflow.fullname" . }}-secrets
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
type: Opaque
data:
  # MCP Server secrets
  jwt-secret-key: your-jwt-secret-key-here

  # Backend secrets
  gemini-api-key: your-gemini-api-key-here

  # Shared secrets
  database-url: postgresql://username:password@host:port/database
  better-auth-secret: your-jwt-secret-key-here

  # Frontend secrets
  smtp-user: your-smtp-username-here
  smtp-pass: your-smtp-password-here
  chatkit-domain-key: your-chatkit-domain-key-here

  # Database credentials (for PostgreSQL StatefulSet)
  db-user: cG9zdGdyZXM=  # base64 encoded "postgres"
  db-password: cGFzc3dvcmQxMjM=  # base64 encoded "password123"
